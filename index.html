<div class="app">

  <header class="header">
    <div class="logo">GroupShare Manager2027</div>
    <button class="login-btn" onclick="login()">Login</button>
  </header>

  <main class="container">

    <section class="welcome">
      <h1>Dashboard</h1>
      <p>គ្រប់គ្រងការចែករំលែក Post របស់អ្នក</p>
    </section>

    <section class="cards">

      <div class="card">
        <h3>👥 Total Groups</h3>
        <strong>0</strong>
      </div>

      <div class="card">
        <h3>📤 Posts Shared</h3>
        <strong>0</strong>
      </div>

      <div class="card">
        <h3>✅ Successful</h3>
        <strong>0</strong>
      </div>

    </section>

    <section class="content">

      <div class="box">

        <h2>📝 Create Post</h2>

        <label>Caption</label>

        <textarea
          id="caption"
          placeholder="សរសេរ Caption របស់អ្នក..."
        ></textarea>

        <label>Post / Website URL</label>

        <input
          id="postUrl"
          type="url"
          placeholder="https://example.com"
        >

        <button class="share-btn" onclick="sharePost()">
          📤 Share Post
        </button>

      </div>

      <div class="box">

        <h2>👥 Groups</h2>

        <div class="group">
          <span>Group 1</span>
          <button onclick="selectGroup(this)">Select</button>
        </div>

        <div class="group">
          <span>Group 2</span>
          <button onclick="selectGroup(this)">Select</button>
        </div>

        <div class="group">
          <span>Group 3</span>
          <button onclick="selectGroup(this)">Select</button>
        </div>

      </div>

    </section>

    <div class="notice">
      ⚠️ Version 1 — Dashboard សម្រាប់សាកល្បង។
      Meta Login និងមុខងារ Share នឹងភ្ជាប់នៅជំហានបន្ទាប់
      តាមសិទ្ធិដែល Meta អនុញ្ញាត។
    </div>

  </main>

</div>
